# The UR-pendant XML-RPC bridge (bridge.py) - only wired by real_main.py.
# It injects sensor_data_received into the loop, waits for
# detection_completed, and serves coords from Detections/FrameRef knowledge.
RobotBridge_Config:
  Logger_Config:
    log_level: INFO
    logger_type: redis
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    terminal: {}
    file:
      filename: MAPLE.log
    redis:
      host: 127.0.0.1
      port: 6379
      channel: RobotBridge:logs
  knowledgeIn:
    properties:
      - property:
          type: data
          name: Detections
          class: Detections
          topic: /detections
          QoS: 10
      - property:
          type: data
          name: FrameRef
          class: FrameRef
          topic: /frame_ref
          QoS: 10
  knowledgeOut:
    properties:
      - property:
          type: data
          name: Detections
          class: Detections
          topic: /detections
          QoS: 10
  eventIn:
    properties:
      - property:
          type: event
          name: detection_completed
          class: "-"
          topic: /detection_completed
          QoS: 10
  eventOut:
    properties:
      - property:
          type: event
          name: sensor_data_received
          class: "-"
          topic: /sensor_data_received
          QoS: 10
  Event_Manager_Config:
    protocol: redis
    host: 127.0.0.1
    port: 6379
  Message_Manager_Config:
    protocol: redis
    host: 127.0.0.1
    port: 6379
  Knowledge_Config:
    knowledge_type: redis
    host: 127.0.0.1
    port: 6379
    db: 0
