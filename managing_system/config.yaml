# ============================================================
# MANAGING SYSTEM config - MAPLE-K node wiring + adaptation policy.
#
# Event flow:
#   sensor_data_received (Sensor tick or RobotBridge RPC)
#                                       --> Monitor    --> observation_recorded
#   observation_recorded                --> Analysis   --> detection_completed
#                                                          (every cycle; unblocks
#                                                          the RobotBridge)
#                                                      --> anomaly_detected
#   anomaly_detected                    --> Plan       --> plan_generated
#   plan_generated                      --> Legitimate --> plan_validated  (accept)
#                                                       --> plan_rejected  (re-plan loop)
#   plan_rejected                       --> Plan       --> plan_generated
#   plan_validated                      --> Execute    --> plan_executed
#
# All hosts are 127.0.0.1 on purpose: "localhost" resolves to ::1 first on
# Windows and stalls ~21s per connection when redis only listens on IPv4.
#
# Managed-system deployment facts (robot IP, ports, model paths, camera) live
# in managed_system/config.yaml, NOT here.
# ============================================================

# Adaptation policy - applied by build_nodes() onto the nodes that use each
# value (Analysis: window/threshold, Plan: candidate, Legitimate: budget).
Adaptation_Config:
  entropy_window_size: 10
  # Calibrated on the light box (plain-detect pseudo-entropy, many screws):
  # healthy frames average ~0.19-0.22, degraded lighting >= 0.40. The mean
  # over surviving detections plateaus just below 0.5 (weak detections drop
  # out of the average as they fall under the conf floor), so 0.5 was
  # unreachable; 0.35 separates the two bands cleanly.
  entropy_threshold: 0.35
  candidate_model_id: 2
  max_replans: 3

Monitor_Config:
  Logger_Config:
    log_level: INFO
    logger_type: redis
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    terminal: {}
    file:
      filename: MAPLE.log
    redis:
      host: 127.0.0.1
      port: 6379
      channel: Monitor:logs
  knowledgeIn:
    properties: null
  knowledgeOut:
    properties:
      - property:
          type: data
          name: FrameRef
          class: FrameRef
          topic: /frame_ref
          QoS: 10
  eventIn:
    properties:
      - property:
          type: event
          name: sensor_data_received
          class: "-"
          topic: /sensor_data_received
          QoS: 10
  eventOut:
    properties:
      - property:
          type: event
          name: observation_recorded
          class: "-"
          topic: /observation_recorded
          QoS: 10
  Event_Manager_Config:
    protocol: redis
    host: 127.0.0.1
    port: 6379
  Message_Manager_Config:
    protocol: redis
    host: 127.0.0.1
    port: 6379
  Knowledge_Config:
    knowledge_type: redis
    host: 127.0.0.1
    port: 6379
    db: 0

