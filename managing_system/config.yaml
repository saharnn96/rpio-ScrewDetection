# ============================================================
# MAPLE-K Config for the screw-detection simulation
#
# Event flow:
#   sensor_data_received (from Sensor)  --> Monitor    --> observation_recorded
#   observation_recorded                --> Analysis   --> anomaly_detected
#   anomaly_detected                    --> Plan       --> plan_generated
#   plan_generated                      --> Legitimate --> plan_validated  (accept)
#                                                       --> plan_rejected  (re-plan loop)
#   plan_rejected                       --> Plan       --> plan_generated
#   plan_validated                      --> Execute    --> plan_executed
#
# The offline `local_bus` shim ignores redis / topics / QoS and dispatches
# in-process. Those fields are kept so this file works unchanged with real
# rpclpy + redis.
# ============================================================

Monitor_Config:
  Logger_Config:
    log_level: INFO
    logger_type: terminal
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    terminal: {}
    file:
      filename: MAPLE.log
    redis:
      host: localhost
      port: 6379
      channel: Monitor:logs
  knowledgeIn:
    properties: null
  knowledgeOut:
    properties:
      - property:
          type: data
          name: FrameRef
          class: FrameRef
          topic: /frame_ref
          QoS: 10
  eventIn:
    properties:
      - property:
          type: event
          name: sensor_data_received
          class: "-"
          topic: /sensor_data_received
          QoS: 10
  eventOut:
    properties:
      - property:
          type: event
          name: observation_recorded
          class: "-"
          topic: /observation_recorded
          QoS: 10
  Event_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Message_Manager_Config:
    protocol: redis
    host: localhost
    port: 6379
  Knowledge_Config:
    knowledge_type: redis
    host: localhost
    port: 6379
    db: 0

